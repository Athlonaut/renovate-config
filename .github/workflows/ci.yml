name: CI

# The preset is resolved from main by every repo in the org, so a malformed file
# breaks Renovate everywhere at once with no PR to revert. Validate it here.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    # Required check in the Athlonaut org branch ruleset — renaming this job
    # locks main until the ruleset is updated to match.
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Validate Renovate config
        run: npx --yes --package renovate -- renovate-config-validator --strict default.json
